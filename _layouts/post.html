---
layout: default
---

<article>
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%Y년 %m월 %d일" }} · {{ page.categories | join: ", " }}</p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <div class="post-nav">
    {% if page.previous.url %}
      <a href="{{ page.previous.url }}">&larr; {{ page.previous.title }}</a>
    {% endif %}
    {% if page.next.url %}
      <a href="{{ page.next.url }}">{{ page.next.title }} &rarr;</a>
    {% endif %}
  </div>
</article>
